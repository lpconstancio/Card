<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucas Constancio</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--ink:#14213d;--mute:#5b6577;--accent:#0b6e99;--line:#e3e7ee}
@media(prefers-color-scheme:dark){:root{--bg:#0e1420;--card:#17202f;--ink:#f1f4f9;--mute:#9aa6ba;--accent:#4fb3de;--line:#27334a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.card{width:100%;max-width:400px;background:var(--card);border-radius:20px;padding:32px 24px 24px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.1)}
.photo{width:128px;height:128px;border-radius:50%;object-fit:cover;border:4px solid var(--card);box-shadow:0 0 0 2px var(--line)}
h1{font-size:1.5rem;margin:16px 0 4px}
.org{color:var(--mute);margin:0 0 24px;font-size:.95rem;line-height:1.4}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:48px;margin-top:10px;border-radius:12px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:1rem;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn:active{opacity:.8}
.alt{display:block;margin-top:12px;font-size:.85rem;color:var(--mute)}
.alt[hidden]{display:none}
</style>
</head>
<body>
<main class="card">
  <img class="photo" src="photo.jpg" alt="Lucas Constancio">
  <h1>Lucas Constancio</h1>
  <p class="org">Saint-Gobain Sekurit Service &amp; Glassdrive Portugal</p>
  <a class="btn primary" href="LucasConstancio.vcf" download>Save contact</a>
  <p class="alt" id="hint" hidden>On Android: after the download, tap <b>Open</b> and choose Contacts.</p>
  <a class="btn" href="tel:+351910257211">Call +351 910 257 211</a>
  <a class="btn" href="mailto:lucas.constancio@saint-gobain.com">Send email</a>
  <a class="btn" href="https://www.linkedin.com/in/lucasconstancio" target="_blank" rel="noopener">LinkedIn</a>
</main>
<script>
if(/Android/i.test(navigator.userAgent)){document.getElementById('hint').hidden=false;}
</script>
</body>
</html>
